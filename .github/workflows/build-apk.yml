name: Build APK

# main に push するたびに APK を作成（Actions の Artifacts からダウンロード可能）
# v で始まるタグ（例: v0.1.2）を push するか、GitHub 上でリリースを作成すると Releases に APK を添付
on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 署名鍵（任意）。リポジトリの Settings → Secrets に登録すると、毎回同じ鍵で署名され上書き更新できる
      KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      # インストール済みアプリの署名鍵の SHA-256（公開情報）。違う鍵の APK は上書き更新できない
      EXPECTED_CERT_SHA256: 66bc7873f5e0e4c9c8d8c1939cfd15facd2170338234f898e498121d1cd95cfe
      IS_RELEASE: ${{ github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: 署名鍵を準備
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing.keystore"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/signing.keystore" >> "$GITHUB_ENV"

      - name: リリースなのに署名鍵が無い場合は止める
        if: ${{ env.IS_RELEASE == 'true' && env.KEYSTORE_B64 == '' }}
        run: |
          echo "::error::Secrets（SIGNING_KEYSTORE_B64 など）が見つかりません。違う鍵の APK を公開しないよう中止します。"
          exit 1

      - name: APK をビルド
        run: ./gradlew assembleRelease --no-daemon

      - name: 署名鍵を確認
        run: |
          set -o pipefail
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "使用する apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk 2>&1 | tee "$RUNNER_TEMP/certs.txt"
          ACTUAL=$(grep -i "SHA-256 digest" "$RUNNER_TEMP/certs.txt" | head -1 | grep -oiE '[0-9a-f]{64}' | tr 'A-F' 'a-f' || true)
          echo "署名鍵 SHA-256: ${ACTUAL:-（取得できませんでした）}"
          if [ -z "$ACTUAL" ]; then
            echo "::error::署名鍵を読み取れませんでした。"
            exit 1
          elif [ "$ACTUAL" = "$EXPECTED_CERT_SHA256" ]; then
            echo "インストール済みアプリと同じ鍵です（上書き更新できます）"
          elif [ "$IS_RELEASE" = "true" ]; then
            echo "::error::署名鍵がインストール済みアプリと違います。公開を中止します。"
            exit 1
          else
            echo "::warning::署名鍵がインストール済みアプリと違います。この APK は上書き更新できません。"
          fi

      - name: APK の名前を整える
        run: cp app/build/outputs/apk/release/app-release.apk CodeWidget.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CodeWidget-apk
          path: CodeWidget.apk

      - name: Releases に公開（タグ・リリースの時だけ）
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: CodeWidget.apk
          generate_release_notes: true
