name: Build APK

# main に push するたびに APK を作成（Actions の Artifacts からダウンロード可能）
# v で始まるタグ（例: v0.1.2）を push するか、GitHub 上でリリースを作成すると Releases に APK を添付
on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 署名鍵（任意）。リポジトリの Settings → Secrets に登録すると、毎回同じ鍵で署名され上書き更新できる
      KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: 署名鍵を準備
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing.keystore"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/signing.keystore" >> "$GITHUB_ENV"

      - name: APK をビルド
        run: ./gradlew assembleRelease --no-daemon

      - name: APK の名前を整える
        run: cp app/build/outputs/apk/release/app-release.apk CodeWidget.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CodeWidget-apk
          path: CodeWidget.apk

      - name: Releases に公開（タグ・リリースの時だけ）
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: CodeWidget.apk
          generate_release_notes: true
